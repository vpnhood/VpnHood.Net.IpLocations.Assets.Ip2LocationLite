name: Publish Nugets

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  id-token: write   # OIDC token for nuget.org trusted publishing (NuGet/login)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIG: 'Release'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Bump version and push
      if: github.event_name == 'push'
      shell: pwsh
      run: |
        #1) Read PubVersion.json, increment build, and save
        $pubVersionFile = Join-Path $env:GITHUB_WORKSPACE 'pub/PubVersion.json'
        $pub = Get-Content $pubVersionFile -Raw | ConvertFrom-Json
        $v = [version]::Parse($pub.Version)
        $newV = [version]::new($v.Major, $v.Minor, ($v.Build + 1))
        $pub.Version = $newV.ToString(3)
        $pub | ConvertTo-Json -Depth 5 | Set-Content -Path $pubVersionFile -Encoding UTF8
        Write-Host "New version: $($pub.Version)"

        #2) Apply this version to all C# project files
        $csprojFiles = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.csproj -File
        foreach ($proj in $csprojFiles) {
          Write-Host "Setting version $($pub.Version) in: $($proj.FullName)"
          $xml = New-Object XML
          $xml.PreserveWhitespace = $true
          $xml.Load($proj.FullName)
          $versionNode = $xml.SelectSingleNode("Project/PropertyGroup/Version")
          if ($null -eq $versionNode) { throw "Version node not found or invalid format in project file: $($proj.FullName)" }
          $versionNode.InnerText = $pub.Version
          $xml.Save($proj.FullName)
        }

        #3) Commit and push using the version from PubVersion.json
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "chore: bump version $($pub.Version)"
        git push

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Solution
      run: dotnet build --no-restore --configuration $BUILD_CONFIG

    # No symbols: this is an inert asset package with no assembly, and forcing IncludeSymbols on it
    # fails the pack (NU5017 - a symbols package with no dependencies nor content).
    - name: Pack All Projects
      run: dotnet pack --configuration $BUILD_CONFIG

    # Trusted publishing: exchange the workflow's OIDC token for a short-lived nuget.org API key
    # (policy: vpnhood/VpnHood.Net.IpLocations.Assets.Ip2LocationLite + nuget-main.yml, created by trudyhood).
    - name: NuGet login (trusted publishing)
      if: github.event_name == 'push'
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: trudyhood

    - name: Publish
      if: github.event_name == 'push'
      run: dotnet nuget push "**/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --skip-duplicate
